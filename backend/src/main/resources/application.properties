
# =========================================
# APPLICATION
# =========================================
spring.application.name=phuGia-Agent
server.port=8080

# =========================================
# MARIADB XAMPP
# =========================================
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/phugia_agent?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =========================================
# HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# =========================================
# UPLOAD
# =========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =========================================
# UTF-8
# =========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================
# INITIAL MASTER PLAN
# =========================================
app.seed.master-plan=true

# =========================================
# JWT SECURITY
# Must be supplied through environment variable
# =========================================
app.jwt.secret-base64=${JWT_SECRET_BASE64:}

# =========================================
# INITIAL ADMIN ACCOUNT
# Used only when no ADMIN account exists
# =========================================
app.bootstrap.admin-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}
